# Python project configuration for code quality tools

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults. Those defaults
# widened in 0.16.0 and turned a clean tree into 379 findings without a line
# of code changing, so the rule set is now stated here and the version is
# pinned in CI. Widen this deliberately, one family at a time.
select = ["E4", "E7", "E9", "F", "I"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
