---
# Forgejo-native CI for ztpbootstrap.
#
# GitHub is a public mirror face only (main + v* tags). It does not run CI.
# See docs/FORGEJO_GITHUB_MIRROR.md.
#
# publish-github is gated on jobs in THIS file only. The separate
# dhcp-integration-test workflow does not block the public mirror.
#
# Runtime notes for this Forgejo instance:
#   * runs-on targets the `strongpod` runner; `ubuntu-latest` matches no
#     runner on this instance.
#   * Actions are fully qualified to data.forgejo.org.
#   * Secret scanners / SBOM / dependency audit invoke underlying tools
#     directly (see scripts/secret-scan.sh).
#   * No upload-artifact steps: that action is known to fail against this
#     Forgejo instance, so reports are written to the job log instead.
name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/*
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: strongpod
    container:
      image: docker.io/library/python:3.12-bookworm
    timeout-minutes: 15
    steps:
      # actions/checkout is a Node action; the plain Python image has
      # neither git nor node.
      - name: Install git and node
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          # gitleaks scans history, so the full clone is required.
          fetch-depth: 0
          persist-credentials: false

      # CI gates on gitleaks only. GitGuardian needs a valid API key in
      # GITGUARDIAN_API_KEY; the Forgejo secret is currently invalid, so
      # ggshield is not part of the merge/publish gate.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.28.0
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run secret scanners
        run: ./scripts/secret-scan.sh ci

  lint:
    name: Code Quality Checks
    runs-on: strongpod
    container:
      image: docker.io/library/python:3.12-bookworm
    timeout-minutes: 15
    steps:
      - name: Install git and node
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install lint tooling
        run: |
          apt-get install -y --no-install-recommends shellcheck
          # ruff is pinned: its default rule set widened in 0.16.0 and would
          # otherwise change the gate without a code change. Rules are
          # selected explicitly in pyproject.toml.
          pip install --quiet black isort yamllint 'ruff==0.16.*'

      - name: Run shellcheck
        run: |
          shellcheck -S error ./*.sh || true
          shellcheck -S error dev/scripts/*.sh dev/tests/*.sh 2>/dev/null || true

      - name: Run yamllint
        run: |
          yamllint ./*.yaml ./*.yml config.yaml.template dev/tests/*.yaml 2>/dev/null \
            || echo "No YAML files to lint"

      - name: Check Python formatting with black
        run: |
          black --check bootstrap.py
          black --check webui/ tests/unit/

      - name: Run ruff (webui + tests)
        run: ruff check webui/ tests/unit/

      - name: Check Python imports with isort
        run: |
          isort --check-only bootstrap.py \
            || echo "Python import sorting check (run isort to auto-fix)"

      - name: Run container security checks
        run: |
          chmod +x dev/scripts/security-check-container-access.sh
          ./dev/scripts/security-check-container-access.sh

  dependency-scan:
    name: Dependency Scanning
    runs-on: strongpod
    container:
      image: docker.io/library/python:3.12-bookworm
    timeout-minutes: 15
    steps:
      - name: Install git and node
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      # Replaces dependency-check/Dependency-Check_Action. pip-audit covers
      # the Python dependencies that actually carry CVE exposure here, and is
      # already the tool scripts/security-scan.sh uses.
      - name: Audit Python dependencies
        run: |
          pip install --quiet pip-audit
          pip-audit -r webui/requirements.txt

  sbom:
    name: Generate SBOM
    runs-on: strongpod
    container:
      image: docker.io/library/python:3.12-bookworm
    timeout-minutes: 15
    steps:
      - name: Install git and node
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs curl

      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      # Replaces anchore/sbom-action, which wraps this same binary.
      - name: Generate SBOM with Syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft scan dir:. -o cyclonedx-json=sbom.cyclonedx.json
          echo "SBOM component count: $(grep -c '"bom-ref"' sbom.cyclonedx.json || echo 0)"

  test:
    name: Run Tests
    needs: [secret-scan, lint]
    # Same python container as other jobs. ci-test.sh and unit tests do not
    # need host podman (:host jobs run inside the runner image, which has no
    # podman binary even though the physical host does).
    runs-on: strongpod
    container:
      image: docker.io/library/python:3.12-bookworm
    timeout-minutes: 30
    steps:
      - name: Install git and node
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs

      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python test dependencies
        run: pip install --quiet -r webui/requirements.txt

      - name: Run Python unit tests
        run: |
          cd tests/unit
          python3 -m unittest discover -s . -p "test_*.py"

      - name: Make test scripts executable
        run: |
          chmod +x dev/tests/ci-test.sh
          chmod +x dev/tests/integration-test.sh

      - name: Run CI test suite
        run: ./dev/tests/ci-test.sh

  publish-github:
    name: Publish main/tags to GitHub
    needs: [secret-scan, lint, dependency-scan, sbom, test]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: strongpod
    container:
      image: docker.io/library/python:3.12-bookworm
    timeout-minutes: 15
    env:
      MIRROR_GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mask mirror token
        run: |
          if [ -n "${MIRROR_GITHUB_TOKEN:-}" ]; then
            printf '::add-mask::%s\n' "${MIRROR_GITHUB_TOKEN}"
          fi

      - name: Publish to GitHub
        env:
          # Prefer context over env GITHUB_REF_TYPE (not reliably exported).
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-github-mirror.sh
          case "${REF}" in
            refs/tags/v*)
              ./scripts/publish-github-mirror.sh --tag "${REF_NAME}"
              ;;
            refs/heads/main)
              ./scripts/publish-github-mirror.sh
              ;;
            *)
              printf 'error: publish-github if: matched unexpected ref %s\n' "${REF}" >&2
              exit 1
              ;;
          esac
