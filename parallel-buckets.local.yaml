  configured_at: "2026-06-22"
  choices:
    ollama_local:
      standard: qwen3.6:35b-a3b-mxfp8
      fast: gemma4:12b-mlx
    ollama_cloud:
      standard: kimi-k2.7-code:cloud
    claude:
      sonnet: sonnet
      opus: opus
    cursor:
      default: auto

skill_symlink: .cursor/skills/parallel-buckets
